<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Muhammad Javid Pasha — MERN Stack & Java Developer. Full-stack projects, skills and background." />
    <meta name="theme-color" content="#14120F" />
    <title>Muhammad Javid Pasha — Full Stack Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("jp-theme") || "amber";
          var mode = localStorage.getItem("jp-mode") || "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.classList.toggle("light", mode === "light");
          root.classList.toggle("dark", mode === "dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
